[tool.poetry]
name = "order-management-system"
version = "0.1.0"
description = "Sistema de gestión de pedidos - Capacitación Python"
authors = ["Gabriel de Jesús Muñoz Ramírez <gabriel.munoz@axity.com>"]
readme = "README.md"
packages = [{include = "order_management", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = {extras = ["email"], version = "^2.14.3"}
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = "^2.0.35"
alembic = "^1.13.3"
httpx = "^0.27.2"
python-dotenv = "^1.0.1"
pydantic-settings = "^2.6.0"
typer = "^0.12.5"
email-validator = "^2.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
black = "^24.10.0"
isort = "^5.13.2"
ruff = "^0.7.4"
mypy = "^1.13.0"
pre-commit = "^4.0.1"
hypothesis = "^6.115.6"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--verbose", "--cov=src/order_management", "--cov-report=term-missing"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.setuptools.package-data]
order_management = ["py.typed"]
